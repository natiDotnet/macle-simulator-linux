<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"/><link rel="stylesheet" href="./css/icon.css"/><link rel="stylesheet" href="./css/preview.css"/><link rel="stylesheet" href="./css/preview.css"/><script src="preview.js"></script></head><body><div id="preview-container" style="display: flex;"><div id="macle-emulation-container" class="macle-emulation-container" style="overflow: hidden"><div class="simulator-toolbar"><div class="flex simulator-toolbar__content w-full gap-x-1.5"><div id="choose-device" class="flex-1 simulator-toolbar-item"></div><div id="choose-percent" class="flex-1 simulator-toolbar-item"></div><div id="choose-touchaction" class="flex-1 simulator-toolbar-item"></div><div class="simulator-toolbar__actions gap-x-1.5"><div id="action-touch" class="simulator-toolbar__actions-item simulator-toolbar__actions-touch icon-touch" title="Touch Event"></div><div id="action-refresh" class="simulator-toolbar__actions-item simulator-toolbar__actions-refresh icon-refresh" title="Refresh"></div><div id="action-devtools" class="simulator-toolbar__actions-item simulator-toolbar__actions-devtools icon-devtools" title="Show/Hide Devtools"></div></div></div></div><div id="browserVeiwbg" class="macle-emulation-container__sub"><div id="macle-container" class="macle-container" style="width: 375px;height: 707px;"><div class="macle-webview-box"><div class="maui-loading-dot-content" id="loading"><div class="maui-loading-dot animated"><i></i> <i></i> <i></i></div></div><webview id="macle-simulator" src="" style="width: 100%; height: 100%; background: #fff" preload="./preload.js" webpreferences="contextIsolation=0"></webview><div class="simulator-mask" id="maskId" style="opacity: 0; display: none;"></div><div class="simulator-actionsheet" id="locationId" style="display: none;"><div class="simulator-actionsheet_menu bg-gray-100"><div class="simulator-actionsheet__cell"><form id="locationForm" class="simulator-form" method="post"><div class="flex flex-col gap-y-1"><h1 class="form-title">Location</h1><span class="locationTip commonTip form-tip">To apply location simulation, click Refresh above after confirming</span></div><div class="flex flex-col gap-y-2"><div class="simulator-form-item"><label class="form-label" for="longitudeId">Longitude</label><div class="input-wrapper"><input id="longitudeId" name="longitude" placeholder="Please enter longitude" class="inputField" required tabindex="0" autofocus></div></div><div class="simulator-form-item"><label class="form-label" for="latitudeId">Latitude</label><div class="input-wrapper"><input id="latitudeId" name="latitude" value="" placeholder="Please enter latitude"></div></div><div class="simulator-form-item"><label class="form-label" for="altitudeId">Altitude</label><div class="input-wrapper"><input id="altitudeId" name="altitude" value="" placeholder="Please enter altitude"></div></div></div><div class="footer"><button id="locationCloseBtnId" type="button" class="cancel">Cancel</button> <button id="locationConfirmBtnId" class="confirm">Confirm</button></div></form></div></div></div><div class="simulator-actionsheet" id="mapId" style="display: none;"><div class="simulator-actionsheet_menu bg-gray-100"><div class="simulator-actionsheet__cell"><form id="mapForm" class="simulator-form" method="post"><div class="flex flex-col gap-y-1"><h1 class="form-title">Map</h1><span class="mapTip commonTip form-tip">To apply configuration, click Refresh above after confirming</span></div><div class="flex flex-col gap-y-2"><div class="simulator-form-item"><label class="form-label" for="googleMapApiKeyId">Google Maps</label><div class="input-wrapper"><input id="googleMapApiKeyId" name="googleMapApiKey" placeholder="Please enter API Key" class="inputField" autofocus></div></div></div><div class="footer"><button id="mapCloseBtnId" type="button" class="cancel">Cancel</button> <button id="mapConfirmBtnId" class="confirm">Confirm</button></div></form></div></div></div><div class="simulator-actionsheet" id="eventSimulateId" style="display: none;"><div class="simulator-actionsheet_menu bg-gray-100"><div class="simulator-actionsheet__cell"><form id="eventSimulateForm" class="simulator-form" method="post"><h1 class="form-title">Event Simulation</h1><div class="flex flex-col gap-y-2"><div class="simulator-form-item"><label class="form-label" for="eventType">Event Type</label> <select id="eventType"><option value="MEMORY_WARNING">Memory Warning</option></select></div><div class="simulator-form-item"><label class="form-label" for="warningLevel">Event Parameter</label> <select id="warningLevel"><option value="5">Warning Level: 5</option><option value="10">Warning Level: 10</option><option value="15">Warning Level: 15</option></select></div></div><div class="footer"><button id="eventSimulateCancelBtnId" type="button" class="cancel">Cancel</button> <button id="eventSimulateConfirmBtnId" type="button" class="confirm">Confirm</button></div></form></div></div></div><div class="simulator-actionsheet" id="customScreenId" style="display: none;"><div class="simulator-actionsheet_menu bg-gray-100"><div class="simulator-actionsheet__cell"><form id="customScreenForm" class="simulator-form" method="post"><h1 class="form-title">Add Custom Screen</h1><div class="flex flex-col gap-y-2"><div class="simulator-form-item"><label class="form-label" for="screenNameId">Name</label><div class="input-wrapper"><input id="screenNameId" name="value" placeholder="Please enter custom screen name" required autofocus></div></div><div class="simulator-form-item"><label class="form-label" for="widthId">Width</label><div class="input-wrapper"><input id="widthId" required maxlength="2000" name="width" value="" placeholder="Please enter screen width" onkeyup="value=value.replace(/^\D*(\d*(?:\.\d{0,2})?).*$/g, '$1')"></div></div><div class="simulator-form-item"><label class="form-label" for="heightId">Height</label><div class="input-wrapper"><input id="heightId" required maxlength="2000" name="height" value="" placeholder="Please enter screen height" onkeyup="value=value.replace(/^\D*(\d*(?:\.\d{0,2})?).*$/g, '$1')"></div></div><div class="simulator-form-item"><label class="form-label" for="dprId">DPR</label><div class="input-wrapper"><input id="dprId" name="dpr" required maxlength="2000" value="" placeholder="Please enter DPR value" onkeyup="value=value.replace(/^\D*(\d*(?:\.\d{0,2})?).*$/g, '$1')" class="inputField"></div></div></div><div class="footer"><button id="customScreenCancelBtnId" type="button" class="cancel">Cancel</button> <button id="customScreenConfirmBtnId" class="confirm">Confirm</button></div></form></div></div></div><div class="simulator-actionsheet" id="deleteCustomScreenId" style="display: none;"><div class="simulator-actionsheet_menu bg-gray-100"><div class="simulator-actionsheet__cell"><form id="deleteCustomScreenForm" class="simulator-form" method="post"><h1 class="form-title">Delete Custom Screen</h1><div id="deleteCustomScreenFormItems" class="simulator-form-item w-full flex flex-col gap-y-2"></div><div class="footer"><button id="deleteCustomScreenCancelBtnId" type="button" class="cancel">Cancel</button> <button id="deleteCustomScreenConfirmBtnId" class="confirm">Delete</button></div></form></div></div></div><div class="simulator-mask" id="maskSkId" style="opacity: 0; display: none"></div><div class="simulator-skcontent" id="loadingId" style="display: none"><div class="simulator-sk"><div class="sk-loading"></div><div class="sk-title" id="skTitle"></div></div></div></div></div></div><div id="skeletonFootId" class="simulator-foot flex items-center"><div class="simulator-toolbar-item toolbar-button flex-shrink-0 select-none border-r border-gray-300">Page Path</div><div id="currentPageId" class="flex-1 simulator-toolbar-item px-2.5 truncate"></div><div class="simulator-footer__actions flex items-center gap-x-1.5"><span id="copyPageDataBtnId" class="simulator-toolbar__actions-item icon-copy toolbar-button cursor-pointer" title="Copy"></span> <span id="generateSkeletonId" class="simulator-toolbar__actions-item icon-shapes toolbar-button cursor-pointer" title="Generate Skeleton Screen"></span><div id="footer-more-operation" class="simulator-toolbar__actions-item dropdown toolbar-button cursor-pointer flex-center"><span class="icon-more"></span></div></div></div></div></div></body></html>
